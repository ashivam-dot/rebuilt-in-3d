name: longform-voice-probe
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Committed bounded chapter repair manifest
        required: true
        type: string
      chapter:
        required: true
        type: choice
        options: [before, people]
      line:
        description: One-based sentence index
        required: true
        type: number
permissions:
  contents: read
  actions: read
concurrency:
  group: longform-voice-probe
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPAIR_MANIFEST: ${{ inputs.manifest }}
      PROBE_CHAPTER: ${{ inputs.chapter }}
      PROBE_LINE: ${{ inputs.line }}
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk for the existing models
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Bounded voice dependencies
        run: bash .github/scripts/install-media-tools.sh ffmpeg espeak-ng
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            work/cache
          key: models-${{ hashFiles('uv.lock', 'tts/uv.lock') }}
          restore-keys: models-
      - name: Existing voice and alignment dependencies
        run: |
          uv sync --frozen
          uv sync --frozen --project tts
      - name: Diagnose only the exact repaired sentence with the existing voice
        run: uv run python -m studio.longform.voice_probe --manifest "$REPAIR_MANIFEST" --chapter "$PROBE_CHAPTER" --line "$PROBE_LINE"
      - name: Retain every isolated take and transcript for direct review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: longform-voice-probe
          path: |
            work/longform/voice-probe/**
            work/longform/chapters/*/chapter.json
            work/longform/repair-source.json
          if-no-files-found: ignore
          retention-days: 30
