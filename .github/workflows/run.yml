name: run
# One pass an hour: watch official feeds, make the best eligible Short, gate it, publish it, record the result.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Make but do not publish"
        type: boolean
        default: false
      event:
        description: "Only make this USGS event ID or wiki:<Article title> (never publishes)"
        type: string
        default: ""
      skip:
        description: "Dry runs only: story ids to pass over, comma-separated (to dry-run a different story)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

# A dry or single-event run never publishes nor saves state, so it does not wait behind (or hold up) the hourly run.
concurrency:
  group: ${{ (inputs.dry || inputs.event != '') && format('studio-dry-{0}', github.run_id) || 'studio' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: youtube
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
      DRY: ${{ inputs.dry && 'true' || 'false' }}
      EVENT: ${{ inputs.event }}
      STUDIO_DRY_SKIP: ${{ inputs.dry && inputs.skip || '' }}
      STUDIO_NEW_STORIES: ${{ vars.STUDIO_NEW_STORIES }}
    # Repository variable PAUSED=true holds the hourly schedule (manual runs still work) while a format is reworked.
    if: github.event_name != 'schedule' || vars.PAUSED != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Check out the state branch
        run: |
          git fetch --depth 1 origin state
          git worktree add state origin/state
      - name: Free disk space for the models
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: System packages
        # Ubuntu's apt mirror hangs for minutes on some runs (2026-10-23: three runs lost, each try > 180 s). The image's
        # own package lists usually suffice, so install from them first and refresh them only when that fails; every
        # apt call is bounded so a hang costs a retry, not the run.
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null && exit 0
            timeout 240 sudo apt-get update -q && timeout 240 sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null && exit 0
            sudo dpkg --configure -a || true
            sleep $((i * 15))
          done
          exit 1
      # The story writer's weights (7 GB) are fetched per run: with them the cache would pass GitHub's 10 GB limit.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            work/cache
            !work/cache/llm
          key: models-${{ hashFiles('uv.lock', 'tts/uv.lock') }}
          restore-keys: models-
      - name: Install
        run: |
          uv sync --frozen
          uv sync --frozen --project tts
          uv run playwright install --with-deps chromium-headless-shell
      - name: Run
        env:
          # A dry or single-event run gets no YouTube credentials at all: it cannot upload even by mistake.
          YOUTUBE_OAUTH_JSON: ${{ !(inputs.dry || inputs.event != '') && secrets.YOUTUBE_OAUTH_JSON || '' }}
        run: |
          if [ -n "$EVENT" ]; then uv run python -m studio.cli make "$EVENT"
          elif [ "$DRY" = "true" ]; then uv run python -m studio.cli run --dry
          else uv run python -m studio.cli run; fi
      - name: Save state
        # A dry or single-event run leaves the state branch as it was.
        if: always() && env.DRY != 'true' && env.EVENT == ''
        run: |
          cd state
          git add -A
          git -c user.name="orbitwire bot" -c user.email="335661989+ashivam-dot@users.noreply.github.com" \
            commit -q -m "state: run $RUN_ID" || exit 0
          # The long-form workflow also pushes to state (longform.json only): rebase and retry when it moved.
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin state && git push -q origin HEAD:state && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Keep the Short
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ github.run_id }}
          path: |
            work/*/short.mp4
            work/*/short.json
            work/*/timing.json
            work/*/writer_log.json
            work/*/stills/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Alert on failure
        if: failure() && env.DRY != 'true' && env.EVENT == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --label alert --search "Studio run failed" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $RUN_URL"
          else gh issue create --label alert --title "Studio run failed" --body "Run: $RUN_URL (details in state/health.json on the state branch)"; fi
